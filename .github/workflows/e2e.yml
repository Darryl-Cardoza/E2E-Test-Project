# Copy this workflow into E2E-Test-Project at .github/workflows/e2e.yml.
# Both repositories are assumed to be under the same personal GitHub account.
name: E2E Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          path: application
      - name: Checkout E2E tests
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/E2E-Test-Repo
          ref: main
          token: ${{ secrets.E2E_REPO_TOKEN || github.token }}
          path: e2e-tests
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        working-directory: application/backend
        run: npm ci
      - name: Install frontend dependencies
        working-directory: application/frontend
        run: npm ci
      - name: Start backend
        working-directory: application/backend
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/e2e_test
          CLIENT_ORIGIN: http://localhost:3000
          PORT: '5000'
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          nohup npm run dev > /tmp/backend.log 2>&1 &
      - name: Start frontend
        working-directory: application/frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
        run: nohup npm run dev > /tmp/frontend.log 2>&1 &
      - name: Wait for application
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5000/api/health >/dev/null && curl -fsS http://localhost:3000 >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/backend.log /tmp/frontend.log || true
          exit 1
      - name: Verify E2E lockfile
        working-directory: e2e-tests
        run: test -f package-lock.json || { echo "package-lock.json is missing from E2E-Test-Repo"; exit 1; }
      - name: Install E2E dependencies
        working-directory: e2e-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: e2e-tests
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:5000/api
          CI: 'true'
        run: npx playwright test --project=chromium
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            e2e-tests/playwright-report/
            e2e-tests/test-results/
          if-no-files-found: warn
          retention-days: 7
